<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor | Base Apparel coming soon page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <div class="left-section">
      <header class="logo-header">
        <img src="images/logo.svg" alt="Base Apparel Logo">
      </header>

      <div class="mobile-hero">
        <img src="images/hero-mobile.jpg" alt="Hero Image Mobile">
      </div>

      <div class="content">
        <h1><span>We're</span> coming soon</h1>
        <p>
          Hello fellow shoppers! We're currently building our new fashion store. 
          Add your email below to stay up-to-date with announcements and special discounts.
        </p>

        <form class="form" novalidate>
          <div class="input-group">
            <input type="email" id="email" placeholder="Email Address">
            <div class="error-icon hidden">
              <img src="images/icon-error.svg" alt="Error Icon">
            </div>
            <button type="submit" aria-label="Submit">
              <img src="images/icon-arrow.svg" alt="Arrow Icon">
            </button>
          </div>
          <small class="error-message hidden">Please provide a valid email</small>
        </form>
      </div>
    </div>

    <div class="right-section">
      <img src="images/hero-desktop.jpg" alt="Hero Image Desktop">
    </div>
  </main>

</body>
</html>
